name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git patch python3 curl xz-utils unzip \
            libc++-19-dev libc++abi-19-dev libunwind-19-dev pkg-config zlib1g-dev
      - name: Restore build downloads and actions
        uses: actions/cache@v4
        with:
          path: |
            build/llvm
            build/repository-cache
            build/action-cache
          key: host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'scripts/toolchain.py') }}-${{ github.sha }}
          restore-keys: |
            host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'scripts/toolchain.py') }}-
      - name: Install pinned compiler
        run: python3 scripts/toolchain.py
      - name: Build and test
        run: |
          export CC="$PWD/build/llvm/bin/clang"
          export CXX="$PWD/build/llvm/bin/clang++"
          python3 scripts/build.py --test --jobs 4 \
            --bazel-option=--linkopt=/usr/lib/llvm-19/lib/libc++abi.a \
            --bazel-option=--host_linkopt=/usr/lib/llvm-19/lib/libc++abi.a
      - name: Verify tag and package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open('upstream.json'))['version']
          tag = os.environ['RELEASE_TAG']
          if tag and tag != 'v' + version:
              raise SystemExit(f'Tag {tag} does not match version {version}')
          PY
          python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: isolate-host-linux-x86_64
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: isolate-host-linux-x86_64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
